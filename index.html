<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#07090d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HYBRID">
<title>HYBRID</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#07090d; --bg2:#0d1117; --card:#141a23; --card2:#1b2330;
  --line:#232d3b; --txt:#e8eef7; --dim:#8b97a8; --dim2:#5d6878;
  --run:#ff5a1f; --str:#3d8bff; --hyb:#25d366; --warn:#ffc53d;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Inter,Roboto,sans-serif;
  overscroll-behavior:none; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;font-size:inherit}
input,select{font-family:inherit;font-size:16px}
::-webkit-scrollbar{width:0;height:0}

/* ---------- shell ---------- */
#app{max-width:520px;margin:0 auto;min-height:100%;position:relative;background:var(--bg)}
#viewport{padding:0 0 108px;min-height:100vh}
.view{padding:0 16px}

/* ---------- page transitions ---------- */
.fade-enter{animation:fadeIn .26s cubic-bezier(.22,.61,.36,1) both}
.fade-exit{animation:fadeOut .16s ease-in both}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px) scale(.995)}to{opacity:1;transform:none}}
@keyframes fadeOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-4px) scale(.995)}}

/* ---------- header ---------- */
.hd{padding:calc(env(safe-area-inset-top) + 18px) 16px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.hd h1{margin:0;font-size:28px;letter-spacing:-.6px;font-weight:800}
.hd .sub{color:var(--dim);font-size:13px;margin-top:3px}
.backbtn{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:15px;padding:6px 2px;font-weight:600}
.backbtn:active{opacity:.6}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.tap{transition:transform .12s ease,background .15s ease}
.card.tap:active{transform:scale(.981);background:var(--card2)}
.ctitle{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim2);font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.big{font-size:44px;font-weight:800;letter-spacing:-2px;line-height:1}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--dim);font-size:13px}
.tiny{color:var(--dim2);font-size:11px}
.chev{color:var(--dim2);font-size:20px;line-height:1}

/* ---------- rings ---------- */
.ring{position:relative;display:grid;place-items:center}
.ring svg{transform:rotate(-90deg)}
.ring .rin{position:absolute;text-align:center;line-height:1.1}
.ring .rin b{display:block;font-size:22px;font-weight:800;letter-spacing:-.5px}
.ring .rin span{font-size:9px;letter-spacing:1.1px;color:var(--dim2);text-transform:uppercase;font-weight:700}

/* ---------- bars ---------- */
.bar{height:7px;border-radius:99px;background:#212a37;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.22,.61,.36,1)}

/* ---------- tab bar (text only) ---------- */
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(9,12,17,.93);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);display:flex;padding:9px 6px calc(env(safe-area-inset-bottom) + 9px);max-width:520px;margin:0 auto}
#tabs button{flex:1;padding:9px 2px;font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--dim2);
  border-radius:11px;transition:color .2s ease,background .2s ease}
#tabs button.on{color:var(--txt);background:#1a2230}

/* ---------- FAB ---------- */
#fab{position:fixed;right:calc(50% - 260px + 18px);bottom:calc(env(safe-area-inset-bottom) + 78px);z-index:61;
  width:56px;height:56px;border-radius:50%;background:linear-gradient(140deg,var(--run),#ff8a3d);
  color:#fff;font-size:30px;font-weight:300;display:grid;place-items:center;
  box-shadow:0 10px 26px rgba(255,90,31,.4);transition:transform .14s ease}
#fab:active{transform:scale(.9)}
@media(max-width:556px){#fab{right:18px}}

/* ---------- buttons ---------- */
.btn{display:block;width:100%;padding:15px;border-radius:14px;font-weight:700;font-size:15px;text-align:center;transition:transform .12s ease,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--run);color:#fff}
.btn.b{background:var(--str);color:#fff}
.btn.g{background:#1e2733;color:var(--txt);border:1px solid var(--line)}
.btn.ghost{background:none;color:var(--dim);border:1px dashed var(--line)}
.btn[disabled]{opacity:.4}
.btn.sm{padding:11px;font-size:14px}
.hstack{display:flex;gap:10px}
.hstack>*{flex:1}

/* ---------- inputs ---------- */
.fld{width:100%;padding:14px;border-radius:12px;background:#101722;border:1px solid var(--line);color:var(--txt);outline:none}
.fld:focus{border-color:var(--str)}
label.lb{display:block;font-size:12px;color:var(--dim);margin:0 0 6px 2px;font-weight:600}
.opt{padding:15px;border-radius:14px;background:#101722;border:1.5px solid var(--line);margin-bottom:9px;transition:.16s;text-align:left;width:100%}
.opt.sel{border-color:var(--run);background:#1d1512}
.opt b{display:block;font-size:15px}
.opt span{color:var(--dim);font-size:12.5px}

/* ---------- list rows ---------- */
.lrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .nm{flex:1;min-width:0}
.lrow .nm b{display:block;font-size:14.5px;font-weight:650}
.lvpill{font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;background:#1e2733;color:var(--dim);white-space:nowrap}
.lvpill.s{background:rgba(61,139,255,.16);color:#7fb2ff}
.lvpill.r{background:rgba(255,90,31,.16);color:#ff9463}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:100;opacity:0;animation:sIn .2s forwards;backdrop-filter:blur(2px)}
@keyframes sIn{to{opacity:1}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:101;max-width:520px;margin:0 auto;background:var(--bg2);
  border-radius:24px 24px 0 0;border-top:1px solid var(--line);padding:8px 16px calc(env(safe-area-inset-bottom) + 20px);
  max-height:88vh;overflow-y:auto;transform:translateY(100%);animation:up .3s cubic-bezier(.22,.61,.36,1) forwards}
@keyframes up{to{transform:none}}
.grab{width:38px;height:4px;border-radius:9px;background:#2c3747;margin:8px auto 14px}
.sheet h3{margin:0 0 14px;font-size:19px;letter-spacing:-.3px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 16px);transform:translateX(-50%);z-index:200;width:min(440px,92vw)}
.tst{background:linear-gradient(135deg,#1d2735,#141c27);border:1px solid #33415a;border-radius:15px;padding:13px 16px;margin-bottom:8px;
  box-shadow:0 14px 34px rgba(0,0,0,.5);animation:tIn .32s cubic-bezier(.22,.61,.36,1)}
@keyframes tIn{from{opacity:0;transform:translateY(-16px) scale(.96)}to{opacity:1;transform:none}}
.tst b{font-size:14.5px}.tst div{color:var(--dim);font-size:12.5px;margin-top:2px}

/* ---------- home edit mode ---------- */
.wrap-w{position:relative}
body.editing .wgt{animation:jig .34s infinite;transform-origin:50% 50%}
body.editing .wgt:nth-child(even){animation-delay:-.17s}
@keyframes jig{0%{transform:rotate(-.55deg)}50%{transform:rotate(.55deg)}100%{transform:rotate(-.55deg)}}
.wgt{position:relative}
.wgt .rm{position:absolute;top:-7px;left:-7px;width:26px;height:26px;border-radius:50%;background:#e5484d;color:#fff;
  font-size:17px;line-height:1;display:none;place-items:center;z-index:5;box-shadow:0 3px 10px rgba(0,0,0,.5);font-weight:600}
body.editing .wgt .rm{display:grid}
body.editing .wgt .card{pointer-events:none}
.wgt.drag{opacity:.9;z-index:50;animation:none!important;transform:scale(1.035);
  box-shadow:0 22px 44px rgba(0,0,0,.6);border-radius:var(--r);position:relative}
.wgt.slide{transition:transform .22s cubic-bezier(.22,.61,.36,1)}
.editbar{display:flex;gap:9px;margin-bottom:12px}
.gal{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:14px;margin-bottom:9px;background:var(--card);width:100%;text-align:left}
.gal b{display:block;font-size:14.5px}
.gal span{color:var(--dim);font-size:12px}
.gal .add{color:var(--hyb);font-size:22px;font-weight:300}

/* ---------- misc ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px}
.stat b{display:block;font-size:23px;font-weight:800;letter-spacing:-.7px}
.stat span{font-size:10.5px;color:var(--dim2);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.seg{display:flex;background:#101722;border-radius:12px;padding:3px;margin-bottom:14px;border:1px solid var(--line)}
.seg button{flex:1;padding:9px;font-size:12.5px;font-weight:700;border-radius:9px;color:var(--dim2);transition:.16s}
.seg button.on{background:#232e3d;color:var(--txt)}
.spark{display:flex;align-items:flex-end;gap:5px;height:74px;margin:6px 0 4px}
.spark div{flex:1;border-radius:4px 4px 2px 2px;background:#233043;min-height:3px;transition:height .4s}
.empty{text-align:center;color:var(--dim2);padding:34px 12px;font-size:13.5px;line-height:1.55}
.chip{display:inline-block;padding:4px 10px;border-radius:99px;background:#1b2431;font-size:11px;color:var(--dim);font-weight:600;margin:0 5px 5px 0}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.setrow{display:grid;grid-template-columns:30px 1fr 1fr 42px;gap:8px;align-items:center;margin-bottom:8px}
.setrow input{padding:11px;text-align:center;border-radius:10px;background:#101722;border:1px solid var(--line);color:var(--txt);outline:none;width:100%}
.setrow .n{color:var(--dim2);font-size:12px;font-weight:700;text-align:center}
.chk{width:42px;height:38px;border-radius:10px;background:#1a2331;display:grid;place-items:center;font-size:16px;color:var(--dim2);border:1px solid var(--line)}
.chk.on{background:rgba(37,211,102,.18);border-color:rgba(37,211,102,.4);color:var(--hyb)}
.srch{position:sticky;top:0;background:var(--bg2);padding:2px 0 10px;z-index:2}
.mvitem{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.hr{height:1px;background:var(--line);margin:14px 0}
.lock{background:#191f2b;border:1px dashed #2e3a4c;border-radius:14px;padding:15px;text-align:center}
</style>
</head>
<body>
<div id="app">
  <div id="viewport"></div>
</div>
<nav id="tabs"></nav>
<button id="fab">+</button>
<div id="toast"></div>
<div id="layer"></div>
<script>
/* ============================================================
   HYBRID v2 — hybrid athlete tracker
   Single-file vanilla JS. State in localStorage key hybrid_v2.
   ============================================================ */
"use strict";

/* ---------------- MOVEMENT LIBRARY ---------------- */
const GROUPS = ["Chest","Back","Legs","Shoulders","Arms","Core"];
const LIB = [
  // Chest
  ["Bench Press (Barbell)","Chest",0],["Incline Bench Press (Barbell)","Chest",0],
  ["Bench Press (Dumbbell)","Chest",0],["Incline Press (Dumbbell)","Chest",0],
  ["Chest Fly (Dumbbell)","Chest",0],["Cable Fly","Chest",0],
  ["Chest Press (Machine)","Chest",0],["Push-Up","Chest",1],["Dip (Chest)","Chest",1],
  // Back
  ["Deadlift (Barbell)","Back",0],["Sumo Deadlift","Back",0],["Rack Pull","Back",0],
  ["Bent-Over Row (Barbell)","Back",0],["Pendlay Row","Back",0],["Row (Dumbbell)","Back",0],
  ["Pull-Up","Back",1],["Chin-Up","Back",1],["Lat Pulldown","Back",0],
  ["Seated Cable Row","Back",0],["T-Bar Row","Back",0],["Face Pull","Back",0],
  // Legs
  ["Back Squat","Legs",0],["Front Squat","Legs",0],["Goblet Squat","Legs",0],
  ["Leg Press","Legs",0],["Hack Squat","Legs",0],["Romanian Deadlift","Legs",0],
  ["Bulgarian Split Squat","Legs",0],["Walking Lunge","Legs",0],["Step-Up","Legs",0],
  ["Leg Extension","Legs",0],["Leg Curl","Legs",0],["Hip Thrust","Legs",0],
  ["Calf Raise","Legs",0],["Nordic Curl","Legs",1],
  // Shoulders
  ["Overhead Press (Barbell)","Shoulders",0],["Shoulder Press (Dumbbell)","Shoulders",0],
  ["Arnold Press","Shoulders",0],["Push Press","Shoulders",0],["Lateral Raise","Shoulders",0],
  ["Front Raise","Shoulders",0],["Rear Delt Fly","Shoulders",0],["Shrug","Shoulders",0],
  // Arms
  ["Barbell Curl","Arms",0],["Dumbbell Curl","Arms",0],["Hammer Curl","Arms",0],
  ["Preacher Curl","Arms",0],["Cable Curl","Arms",0],["Incline Curl","Arms",0],
  ["Tricep Pushdown","Arms",0],["Overhead Tricep Extension","Arms",0],
  ["Skullcrusher","Arms",0],["Close-Grip Bench Press","Arms",0],
  ["Tricep Dip","Arms",1],["Tricep Kickback","Arms",0],
  // Core
  ["Hanging Leg Raise","Core",1],["Cable Crunch","Core",0],["Ab Wheel Rollout","Core",1],
  ["Russian Twist","Core",0],["Decline Sit-Up","Core",1],["Weighted Plank","Core",0],
  ["Farmer's Carry","Core",0],

  /* ---- expanded library ---- */
  // Chest
  ["Decline Bench Press (Barbell)","Chest",0],["Machine Chest Fly (Pec Deck)","Chest",0],
  ["Cable Crossover","Chest",0],["Low-to-High Cable Fly","Chest",0],["Incline Cable Fly","Chest",0],
  ["Smith Machine Bench Press","Chest",0],["Landmine Press","Chest",0],["Svend Press","Chest",0],
  ["Dumbbell Pullover","Chest",0],["Floor Press","Chest",0],["Guillotine Press","Chest",0],
  ["Deficit Push-Up","Chest",1],["Archer Push-Up","Chest",1],
  // Back
  ["Trap Bar Deadlift","Back",0],["Snatch-Grip Deadlift","Back",0],["Deficit Deadlift","Back",0],
  ["Chest-Supported Row (Machine)","Back",0],["Meadows Row","Back",0],["Kroc Row","Back",0],
  ["Seal Row","Back",0],["Inverted Row","Back",1],["Straight-Arm Pulldown","Back",0],
  ["Single-Arm Lat Pulldown","Back",0],["Machine Row","Back",0],["Good Morning","Back",0],
  ["Back Extension","Back",1],["Wide-Grip Pull-Up","Back",1],["Neutral-Grip Pull-Up","Back",1],
  // Legs
  ["Sumo Squat","Legs",0],["Box Squat","Legs",0],["Belt Squat","Legs",0],
  ["Smith Machine Squat","Legs",0],["Pause Squat","Legs",0],["Zercher Squat","Legs",0],
  ["Reverse Lunge","Legs",0],["Curtsy Lunge","Legs",0],["Cossack Squat","Legs",1],
  ["Pistol Squat","Legs",1],["Sissy Squat","Legs",1],["Seated Leg Curl","Legs",0],
  ["Standing Calf Raise","Legs",0],["Seated Calf Raise","Legs",0],["Adductor Machine","Legs",0],
  ["Abductor Machine","Legs",0],["Glute Kickback (Cable)","Legs",0],["Single-Leg RDL","Legs",0],
  ["Sled Push","Legs",0],
  // Shoulders
  ["Machine Shoulder Press","Shoulders",0],["Cable Lateral Raise","Shoulders",0],
  ["Upright Row","Shoulders",0],["Reverse Pec Deck","Shoulders",0],["Cuban Press","Shoulders",0],
  ["Y-Raise","Shoulders",0],["Landmine Press (Shoulders)","Shoulders",0],
  ["Handstand Push-Up","Shoulders",1],["Pike Push-Up","Shoulders",1],["Behind-the-Neck Press","Shoulders",0],
  // Arms
  ["Concentration Curl","Arms",0],["Spider Curl","Arms",0],["Reverse Curl","Arms",0],
  ["Zottman Curl","Arms",0],["Cable Hammer Curl","Arms",0],["EZ-Bar Curl","Arms",0],
  ["Rope Pushdown","Arms",0],["Cable Overhead Tricep Extension","Arms",0],["Bench Dip","Arms",1],
  ["Diamond Push-Up","Arms",1],["Wrist Curl","Arms",0],["Reverse Wrist Curl","Arms",0],
  ["JM Press","Arms",0],
  // Core
  ["Plank","Core",1],["Side Plank","Core",1],["Bicycle Crunch","Core",1],["Mountain Climber","Core",1],
  ["Dead Bug","Core",1],["Hollow Hold","Core",1],["Toes-to-Bar","Core",1],["Reverse Crunch","Core",1],
  ["V-Up","Core",1],["Dragon Flag","Core",1],["Pallof Press","Core",0],["Cable Woodchopper","Core",0],
  ["Suitcase Carry","Core",0],["Hanging Knee Raise","Core",1],["Sit-Up","Core",1]
].map(m=>({name:m[0],group:m[1],bw:!!m[2]}));
const LIBMAP = Object.fromEntries(LIB.map(m=>[m.name,m]));
const GCOLOR = {Chest:"#3d8bff",Back:"#25d366",Legs:"#ff5a1f",Shoulders:"#c084fc",Arms:"#ffc53d",Core:"#22d3ee"};
/* Muscle sub-groups a user can tag a custom movement with. */
const MUSCLES = ["Upper Chest","Lower Chest","Lats","Traps","Rhomboids","Lower Back",
  "Front Delts","Side Delts","Rear Delts","Biceps","Triceps","Forearms","Grip",
  "Quads","Hamstrings","Glutes","Calves","Adductors","Abductors","Abs","Obliques"];
/* LIB plus any movements the user built themselves. */
function allMoves(){ return LIB.concat(S && S.customMoves ? S.customMoves : []); }

/* ---------------- LEVEL ENGINE (canonical formulas) ---------------- */
const Level = {
  // Cardio: cumulative miles. L2@1, L3@3, L4@6, L5@10, L6@15, L7@24, L8@37, L9@54, L10@75, then +50/level.
  runIncrement(lv){ if(lv<=5) return lv; if(lv<=9) return Math.min(50,(lv-6)*4+9); return 50; },
  run(miles){
    let lv=1, floor=0, guard=0;
    while(guard++<5000){
      const inc=this.runIncrement(lv);
      if(miles>=floor+inc){ floor+=inc; lv++; } else break;
    }
    const inc=this.runIncrement(lv);
    return {level:lv, floor, next:floor+inc, need:+(floor+inc-miles).toFixed(2),
            pct: inc? Math.min(1,(miles-floor)/inc):0};
  },
  // Strength per movement: cumulative volume (weight x reps).
  strIncrement(lv){ const s=[100,150,200,300,500,750,1000,1500]; return s[lv-1]!==undefined?s[lv-1]:2000; },
  str(vol){
    let lv=1, floor=0, guard=0;
    while(guard++<5000){
      const inc=this.strIncrement(lv);
      if(vol>=floor+inc){ floor+=inc; lv++; } else break;
    }
    const inc=this.strIncrement(lv);
    return {level:lv, floor, next:floor+inc, need:Math.round(floor+inc-vol),
            pct: inc? Math.min(1,(vol-floor)/inc):0};
  },
  // Overall strength = average level across movements you have actually trained.
  overallStrength(movements){
    const ls=Object.keys(movements||{}).filter(k=>movements[k].volume>0).map(k=>this.str(movements[k].volume).level);
    if(!ls.length) return 1;
    return ls.reduce((a,b)=>a+b,0)/ls.length;
  },
  // Hybrid Index — rewards balance across both disciplines (max -25% for lopsided).
  hybrid(runLv, strLv){
    const base=(runLv+strLv)/2, gap=Math.abs(runLv-strLv), sum=runLv+strLv;
    const balance = 1 - Math.min(.25, sum? (gap/sum)*.5 : 0);
    return base*balance;
  }
};

/* ---------------- FUEL ENGINE (canonical calorie + macro formulas) ----------------
   Mirrors the Postgres/TypeScript engine in the backend repo. If you change a
   constant here, change it there. Full write-up in docs/nutrition-model.md.
   ------------------------------------------------------------------------------- */
const Fuel = {
  // Classic activity factors, for the "one number every day" model.
  ACT:{sedentary:1.2, light:1.375, moderate:1.55, very:1.725, extra:1.9},
  ACTNAME:{sedentary:"Barely active",light:"Lightly active",moderate:"Moderately active",
           very:"Very active",extra:"Extremely active"},
  ACTDESC:{sedentary:"Desk job, little or no training",
           light:"Training 1–3 days a week",
           moderate:"Training 3–5 days a week",
           very:"Training 6–7 days a week",
           extra:"Two-a-days, or training plus a physical job"},
  // NEAT factors for the training-load model. These cover LIVING only —
  // your logged runs and lifts get added on top, so nothing is double counted.
  NEAT:{desk:1.2, on_feet:1.35, manual:1.5},
  NEATNAME:{desk:"Desk job",on_feet:"On my feet all day",manual:"Physical job"},
  NEATDESC:{desk:"Mostly seated outside training",on_feet:"7,500–12,000 steps before training",
            manual:"12,000+ steps, manual work"},
  FLOOR:{male:1500, female:1200},          // never serve a target below this
  EAMIN:{male:25, female:30},              // kcal/kg lean mass — the RED-S line
  FATFLOOR:{male:.8, female:1},            // g/kg bodyweight
  KCAL_PER_KG:7700,                        // ~1 kg of body mass
  RUN_KCAL:1.036,                          // kcal per kg per km, gross
  LIFT_MET:5,                              // moderate resistance training
  MIN_PER_SET:3,                           // when a lift has no recorded duration
  BF_KCAL_PER_FEED:65,                     // gross energy to make milk for one nursing/pump session
                                           // (~500 kcal/day across 8 feeds — the figure cited for exclusive breastfeeding)

  kg(){ return (+S.profile.bodyweight||0)/2.20462262185; },
  cm(){ return (+S.profile.heightIn||0)*2.54; },
  // Age self-corrects: we store what they told us and the year they told us.
  age(){ const p=S.profile; if(!p.age) return 0;
    return p.age + Math.max(0, new Date().getFullYear()-(p.ageYear||new Date().getFullYear())); },
  ready(){ const p=S.profile; return !!(p.sex && p.heightIn>0 && p.age>0 && p.bodyweight>0); },
  lbm(){ const bf=+S.profile.bodyFat||0; return bf>0 ? this.kg()*(1-bf/100) : null; },

  // Resting metabolism. Lean mass beats a population average, so body fat %
  // switches us to Katch-McArdle — which needs no sex term at all, because
  // lean mass already carries the difference.
  bmr(){
    const lb=this.lbm();
    // A manually entered resting burn overrides the equation, but we still
    // carry lean mass through (from body fat %) so protein and RED-S math hold.
    if(S.profile.bmrManual && +S.profile.bmrCustom>0)
      return {v:+S.profile.bmrCustom, f:"Your number", lbm:lb};
    if(lb!=null) return {v:370+21.6*lb, f:"Katch-McArdle", lbm:lb};
    const v=10*this.kg()+6.25*this.cm()-5*this.age()+(S.profile.sex==="female"?-161:5);
    return {v, f:"Mifflin-St Jeor", lbm:null};
  },

  /* The equation's own resting number, ignoring any manual override — used to
     pre-fill and label the "set your own" field in Settings. */
  bmrAuto(){
    const lb=this.lbm();
    if(lb!=null) return Math.round(370+21.6*lb);
    return Math.round(10*this.kg()+6.25*this.cm()-5*this.age()+(S.profile.sex==="female"?-161:5));
  },

  /* Calories burned making milk. Uses the count logged for a given day if there
     is one, otherwise the average the mother gave at signup. Zero unless she is
     flagged as a breastfeeding mother. */
  breastfeedingBurn(feeds){
    const p=S.profile;
    if(p.sex!=="female" || p.breastfeeding!=="yes") return 0;
    let n;
    if(feeds!=null) n=feeds;
    else{ const d=S.macros[todayKey()]; n=(d&&d.bf!=null)?d.bf:(+p.feedsPerDay||0); }
    return Math.max(0, Math.round((+n||0)*this.BF_KCAL_PER_FEED));
  },

  // What today's logged training actually cost. This is the payoff of having
  // runs and lifts in one app: no other calorie tracker has this number.
  burn(bmrV, key){
    const k=key||todayKey(), kg=this.kg();
    let run=0, lift=0, runMin=0, liftMin=0;
    S.runLog.forEach(r=>{
      if(dkey(r.date)!==k) return;
      const min=+r.min||Math.round(r.miles*9);
      const gross=this.RUN_KCAL*kg*(r.miles*1.609344);
      run+=Math.max(0,gross-(bmrV/1440)*min); runMin+=min;
    });
    S.liftLog.forEach(l=>{
      if(dkey(l.date)!==k) return;
      const min=+l.min || ((l.sets&&l.sets.length)||0)*this.MIN_PER_SET || 15;
      const gross=this.LIFT_MET*3.5*kg/200*min;
      lift+=Math.max(0,gross-(bmrV/1440)*min); liftMin+=min;
    });
    return {kcal:run+lift, run, lift, min:runMin+liftMin, runMin, liftMin};
  },

  /* Default goal offsets from resting, in kcal. The target itself is stored on
     the profile (calTarget) so the user "sets it for themselves"; these are just
     the starting points when they tap a goal. */
  GOAL_OFFSET:{lose:-500, maintain:0, gain:300},

  /* The target that sits under a goal, anchored to resting. Maintain is always
     exactly resting; lose/gain default to an offset but the stored calTarget
     (if the user edited it) wins. */
  goalTarget(resting, goal, p){
    p=p||S.profile; goal=goal||p.calGoal||"maintain";
    if(goal==="maintain") return Math.round(resting);
    if(+p.calTarget>0) return Math.round(+p.calTarget);
    return Math.round(resting + (this.GOAL_OFFSET[goal]||0));
  },

  compute(opts){
    opts=opts||{};
    const p=S.profile, kg=this.kg(), b=this.bmr();
    const resting=b.v;

    // Active / working calories: non-exercise living (your job/steps, via NEAT)
    // plus whatever today's logged training actually cost. Shown on its own —
    // in this model it is NOT folded into the target.
    const neat=Math.max(0, resting*((this.NEAT[p.neat]||this.NEAT.desk)-1));
    const basis=this.basis(resting);
    const training=basis.kcal;
    const active=neat+training;
    const tdee=resting+active;               // full daily burn, for reference

    const bfBurn=this.breastfeedingBurn();    // milk production rides on top of the target
    const goal=opts.goal||p.calGoal||"maintain";
    const base=this.goalTarget(resting, goal, p);   // anchored to resting
    let target=base+bfBurn;

    const flags=[];
    const floor=this.FLOOR[p.sex]||1500;
    if(target<floor){ flags.push({s:"warn",t:`Raised to the ${floor} kcal floor — the lowest we'll ever suggest.`}); target=floor; }

    // Protein first, then a sex-specific fat floor, then carbs take the rest.
    const protein = b.lbm!=null ? b.lbm*(goal==="lose"?2.8:2.3) : kg*(goal==="lose"?2.2:1.8);
    const fat = Math.max((this.FATFLOOR[p.sex]||.8)*kg, target*.25/9);
    const carbs = Math.max(0,(target-protein*4-fat*9)/4);
    if(carbs<=0) flags.push({s:"bad",t:"Protein and fat use up the whole target — raise it or ease the deficit."});

    // Energy availability vs. everything you burn being active. Eating at resting
    // while training hard is a genuine deficit, so this can fire — by design.
    if(b.lbm!=null && active>0){
      const ea=(target-active)/b.lbm, min=this.EAMIN[p.sex]||25;
      if(ea<min) flags.push({s:"warn",
        t:`Energy availability ~${Math.round(ea)} kcal/kg lean mass, under the ${min} line linked to RED-S. Eating around resting on a hard training day is a deep deficit — good for a short block, not somewhere to live.`});
    }

    return {bmr:Math.round(resting), formula:b.f, lbm:b.lbm, bfBurn:Math.round(bfBurn),
            resting:Math.round(resting), neat:Math.round(neat), training:Math.round(training),
            active:Math.round(active), tdee:Math.round(tdee),
            target:Math.round(target), base:Math.round(base), goal,
            exercise:Math.round(active), estimated:basis.source!=="today", burn:basis.burn, source:basis.source, model:"resting",
            protein:Math.round(protein), fat:Math.round(fat), carbs:Math.round(carbs),
            fiber:Math.round(target/1000*14), flags};
  },

  weekKm(){ return runsSince(weekAgo(6)).reduce((a,r)=>a+r.miles,0)*1.609344; },

  /* Average daily training burn over the last 7 days. */
  avgBurn(bmrV){
    let sum=0;
    for(let i=0;i<7;i++){ const d=new Date(); d.setDate(d.getDate()-i); sum+=this.burn(bmrV,dkey(d)).kcal; }
    return sum/7;
  },

  /* Which training number the training-load model should use today.
     Nothing logged yet at 8am shouldn't hand you a rest-day target, and a
     brand new account has no history at all — so fall back in stages. */
  basis(bmrV){
    const today=this.burn(bmrV);
    if(today.kcal>0) return {kcal:today.kcal, source:"today", burn:today};
    const avg=this.avgBurn(bmrV);
    if(avg>0) return {kcal:avg, source:"average", burn:today};
    const planned=Math.max(0,bmrV*(this.ACT[S.profile.activity]||this.ACT.moderate)-bmrV*1.2);
    return {kcal:planned, source:"planned", burn:today};
  },

  // Sex-specific micronutrients worth surfacing. Iron is the big one: it is the
  // most common deficiency in female runners, and foot-strike haemolysis makes
  // endurance athletes of either sex worse off than the general population.
  micros(){
    const p=S.profile, menstruating = p.sex==="female" && this.age()<51;
    return {iron:Math.round((menstruating?18:8)*1.3), calcium:1000, vitD:1000,
            note: menstruating
              ? "Iron deficiency is the most common nutritional problem in female runners — worth a ferritin test rather than guessing."
              : "Endurance training raises iron needs through sweat and foot-strike haemolysis."};
  }
};

/* ---------------- STATE ---------------- */
const KEY="hybrid_v2", OLDKEY="hybrid_v1";
const DEFAULT_WIDGETS=["hybrid","levels","week","protein","activity"];
const blank=()=>({
  onboarded:false,
  profile:{name:"",goal:"",experience:"",runDays:3,liftDays:3,split:"",proteinTarget:150,trackFC:false,bodyweight:175,premium:false,
    // fuel engine inputs — see the Fuel object above
    sex:"", heightIn:0, age:0, ageYear:0, bodyFat:0,
    activity:"moderate", neat:"desk", calModel:"training_load",
    calGoal:"maintain", calRate:.75, calTarget:0, proteinManual:false,  // calTarget: user-set daily calories (anchored to resting)
    bmrManual:false, bmrCustom:0,               // set-your-own resting calories
    breastfeeding:"", feedsPerDay:0,            // nursing/pumping calorie burn
    usdaKey:""},                                // USDA FoodData Central API key (recipe lookups)
  totals:{miles:0,runs:0,lifts:0,minutes:0},
  movements:{},           // name -> {volume, sets, best:{w,r}}
  customMoves:[],         // user-built movements: {name,group,sub:[],bw}
  recipes:[],             // saved meals: {id,name,servings,ingredients:[{raw,grams,name,kcal,p,f,c}]}
  weightLog:[],           // body-weight over time: [{date, w}] — first entry is the starting weight
  runLog:[], liftLog:[], macros:{}, routines:[], layout:DEFAULT_WIDGETS.slice(),
  active:null             // in-progress routine session
});
const toastQ=[];
let S = load();

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){ const d=JSON.parse(raw); return migrate(d); }
    const old=localStorage.getItem(OLDKEY);
    if(old){ const d=JSON.parse(old); toastQ.push(["Progress imported","Your v1 data carried over."]); return migrate(d); }
  }catch(e){ console.warn("load failed",e); }
  return blank();
}
function migrate(d){
  const b=blank();
  const out=Object.assign(b,d);
  out.profile=Object.assign(b.profile,d.profile||{});
  out.totals=Object.assign(b.totals,d.totals||{});
  out.movements=d.movements||{};
  // v1 short names -> v2 library names
  const map={"Squat":"Back Squat","Bench Press":"Bench Press (Barbell)","Deadlift":"Deadlift (Barbell)",
             "Overhead Press":"Overhead Press (Barbell)","Barbell Row":"Bent-Over Row (Barbell)","Pull-up":"Pull-Up"};
  Object.keys(map).forEach(k=>{
    if(out.movements[k]){
      const t=map[k], src=out.movements[k];
      out.movements[t]=out.movements[t]||{volume:0,sets:0};
      out.movements[t].volume+=src.volume||0; out.movements[t].sets+=src.sets||0;
      delete out.movements[k];
    }
  });
  // Custom movements the user built: register them so grouping and colours work.
  out.customMoves=Array.isArray(d.customMoves)?d.customMoves:[];
  out.customMoves.forEach(m=>{ if(m&&m.name) LIBMAP[m.name]={name:m.name,group:m.group||"Other",bw:!!m.bw,sub:m.sub||[]}; });
  Object.keys(out.movements).forEach(k=>{ if(!LIBMAP[k]) LIBMAP[k]={name:k,group:"Other",bw:false}; });
  if(!Array.isArray(out.layout)||!out.layout.length) out.layout=DEFAULT_WIDGETS.slice();
  if(!Array.isArray(out.routines)) out.routines=[];
  if(!Array.isArray(out.recipes)) out.recipes=[];
  if(!Array.isArray(out.weightLog)) out.weightLog=[];
  // Existing users with a bodyweight but no history get a starting point today.
  if(d.onboarded && !out.weightLog.length && out.profile.bodyweight>0)
    out.weightLog=[{date:new Date().toISOString(), w:+out.profile.bodyweight}];
  // Anyone who onboarded before calories existed keeps a manual protein target
  // until they fill in the new fields. Nobody's saved numbers change under them.
  if(d.onboarded && !out.profile.sex) out.profile.proteinManual=true;
  return out;
}

/* Calories for a logged day. Days logged before calorie tracking existed have
   no stored total, so derive one from the macros rather than showing zero. */
function dayFuel(k){
  const m=S.macros[k||todayKey()]||{p:0,f:0,c:0,items:[]};
  const kcal = m.kcal!=null ? m.kcal : (m.p||0)*4+(m.c||0)*4+(m.f||0)*9;
  return {p:m.p||0, f:m.f||0, c:m.c||0, kcal, items:m.items||[]};
}
/* The targets in play right now: computed once the profile is filled in,
   falling back to the hand-typed protein number for everyone else. */
function fuelTargets(){ return Fuel.ready() ? Fuel.compute() : null; }
function proteinGoal(t){
  t = t===undefined ? fuelTargets() : t;
  return (!t || S.profile.proteinManual) ? (+S.profile.proteinTarget||150) : t.protein;
}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} };

/* ---------------- DERIVED ---------------- */
function stats(){
  const r=Level.run(S.totals.miles);
  const sLv=Level.overallStrength(S.movements);
  return {run:r, strLevel:sLv, hybrid:Level.hybrid(r.level,sLv),
          trained:Object.keys(S.movements).filter(k=>S.movements[k].volume>0)};
}
// local calendar day, not UTC — so "today" rolls over at local midnight
const dkey=d=>{ const x=new Date(d);
  return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
const todayKey=()=>dkey(new Date());
function weekAgo(n){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-n); return d.getTime(); }
function runsSince(ms){ return S.runLog.filter(r=>new Date(r.date).getTime()>=ms); }
function liftsSince(ms){ return S.liftLog.filter(l=>new Date(l.date).getTime()>=ms); }
const fmt=(n,d=1)=>Number(n).toFixed(d).replace(/\.0+$/,"");
const pace=(mi,min)=> mi>0? (()=>{const p=min/mi;return Math.floor(p)+":"+String(Math.round((p%1)*60)).padStart(2,"0");})() : "—";

/* ---------------- UI HELPERS ---------------- */
const $=s=>document.querySelector(s);
const vp=()=>$("#viewport");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function ring(pct,label,val,color,size=104,stroke=9){
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-Math.max(0,Math.min(1,pct)));
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#1e2734" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
        style="transition:stroke-dashoffset .8s cubic-bezier(.22,.61,.36,1)"/>
    </svg>
    <div class="rin"><b>${val}</b><span>${label}</span></div></div>`;
}
function toast(title,sub){
  const el=document.createElement("div");
  el.className="tst"; el.innerHTML=`<b>${esc(title)}</b>${sub?`<div>${esc(sub)}</div>`:""}`;
  $("#toast").appendChild(el);
  setTimeout(()=>{ el.style.transition="opacity .3s,transform .3s"; el.style.opacity=0; el.style.transform="translateY(-12px)";
    setTimeout(()=>el.remove(),320); }, 3200);
}
function flushToasts(){ while(toastQ.length){ const t=toastQ.shift(); toast(t[0],t[1]); } }

/* ---------------- SHEETS ---------------- */
let sheetOpen=false;
function sheet(html,opts={}){
  closeSheet(true);
  sheetOpen=true;
  const scrim=document.createElement("div"); scrim.className="scrim"; scrim.id="scrim";
  const s=document.createElement("div"); s.className="sheet"; s.id="sheet";
  s.innerHTML=`<div class="grab"></div>`+html;
  scrim.onclick=()=>{ if(opts.persist!==true) closeSheet(); };
  $("#layer").appendChild(scrim); $("#layer").appendChild(s);
  if(opts.after) opts.after(s);
  return s;
}
function closeSheet(instant){
  const s=$("#sheet"), sc=$("#scrim");
  if(!s&&!sc) return;
  sheetOpen=false;
  if(instant){ s&&s.remove(); sc&&sc.remove(); return; }
  if(s){ s.style.transition="transform .22s ease-in"; s.style.transform="translateY(100%)"; }
  if(sc){ sc.style.transition="opacity .22s"; sc.style.opacity=0; }
  setTimeout(()=>{ s&&s.remove(); sc&&sc.remove(); },230);
}
</script>
<script>
/* ============================================================
   ROUTER + PAGE TRANSITIONS
   Every page/tab change fades the old view out and the new one in.
   ============================================================ */
const TABS=[["home","Home"],["train","Train"],["tree","Tree"],["fuel","Fuel"],["ranks","Ranks"]];
const TABOF={home:"home",running:"home",strength:"home",movement:"home",settings:"home",
             train:"train",routine:"train",workout:"train",tree:"tree",fuel:"fuel",ranks:"ranks",
             recipes:"fuel",recipe:"fuel"};
let route={page:"home",param:null}, animating=false, editing=false;

function nav(page,param){
  if(animating) return;
  if(page===route.page && JSON.stringify(param)===JSON.stringify(route.param)) return;
  if(editing) setEdit(false);
  closeSheet();
  animating=true;
  const cur=vp().firstElementChild;
  if(cur){ cur.classList.remove("fade-enter"); cur.classList.add("fade-exit"); }
  setTimeout(()=>{
    route={page,param};
    paint();
    window.scrollTo(0,0);
    animating=false;
    // A pending app update was held back during a workout — apply it now.
    if(window.__pendingSWReload && page!=="workout"){ location.reload(); }
  }, cur?165:0);
}
function repaint(){ // in-place refresh, no fade
  const cur=vp().firstElementChild, y=window.scrollY;
  paint(true); window.scrollTo(0,y);
}
function paint(noAnim){
  const html=(PAGES[route.page]||PAGES.home)(route.param);
  vp().innerHTML=`<div class="view ${noAnim?"":"fade-enter"}">${html}</div>`;
  drawTabs();
  const fn=AFTER[route.page]; if(fn) fn(route.param);
}
function drawTabs(){
  const t=TABOF[route.page]||"home";
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" class="${k===t?"on":""}">${l}</button>`).join("");
  const hide = route.page==="workout" || !S.onboarded;
  $("#tabs").style.display=hide?"none":"flex";
  $("#fab").style.display=hide?"none":"grid";
}
$("#tabs").addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(b) nav(b.dataset.tab,null); });
$("#fab").addEventListener("click",()=>quickLog());

/* header helper */
function head(title,sub,back){
  return `<div class="hd" style="padding-left:0;padding-right:0">
    <div>${back?`<button class="backbtn" onclick="nav('${back}',null)">‹ Back</button>`:""}
      <h1>${esc(title)}</h1>${sub?`<div class="sub">${esc(sub)}</div>`:""}</div>
    ${route.page==="home"?`<button class="backbtn" onclick="nav('settings',null)" style="font-size:13px">Settings</button>`:""}
  </div>`;
}

/* ============================================================
   ONBOARDING
   ============================================================ */
const ONB=[
  {k:"sex",q:"Biological sex?",note:"Drives the calorie equation, your fat floor and your iron target. Nothing else in the app changes.",
    o:[["male","Male",""],["female","Female",""]]},
  {k:"breastfeeding",q:"Are you a breastfeeding mother?",when:d=>d.sex==="female",
    note:"Making milk burns real calories, so we'll add them to your daily target and let you track feeds on the Fuel tab.",
    o:[["yes","Yes",""],["no","No",""]]},
  {k:"feedsPerDay",q:"Feeds or pumps a day, on average?",when:d=>d.sex==="female"&&d.breastfeeding==="yes",
    note:"A rough number is fine — you can log the exact count each day on the Fuel tab.",
    o:[[6,"6 or fewer","Older baby, some solids"],[8,"7–8","Established routine"],
       [10,"9–10","Frequent feeding"],[12,"11 or more","Newborn / cluster feeding"]]},
  {k:"goal",q:"What's your main goal?",o:[["balanced","Balanced hybrid","Run far, lift heavy, stay even"],
    ["endurance","Endurance first","Racing is the priority, lifting supports it"],
    ["strength","Strength first","Lifting is the priority, running supports it"],
    ["race","Race + PR","Chasing a race time and a lifting PR at once"]]},
  {k:"experience",q:"Where are you at?",o:[["new","New to training","Under a year of consistent work"],
    ["some","Some experience","1–3 years, know the basics"],["exp","Experienced","3+ years of structured training"]]},
  {k:"runDays",q:"Run days per week?",o:[[1,"1–2 days","Light running base"],[3,"3–4 days","Standard hybrid volume"],
    [5,"5–6 days","Serious mileage"],[7,"Every day","Run streak"]]},
  {k:"liftDays",q:"Lift days per week?",o:[[2,"2 days","Full body, minimal"],[3,"3 days","Push / pull / legs"],
    [4,"4 days","Upper / lower split"],[5,"5+ days","High frequency"]]},
  {k:"split",q:"How do you structure it?",o:[["same","Same day","Lift and run on the same day"],
    ["sep","Separate days","Never stack the two"],["flex","Flexible","Whatever the week allows"]]},
  {k:"neat",q:"Outside of training, your day is…",note:"Training gets counted separately from your logged runs and lifts — this is just the rest of your life.",
    o:[["desk","Desk job","Mostly seated, under ~5,000 steps"],
       ["on_feet","On my feet","7,500–12,000 steps before any training"],
       ["manual","Physical job","12,000+ steps, manual work"]]}
];
/* Suggest an activity level from the training volume they already told us.
   They can still override it in Settings — this just avoids asking twice. */
function suggestActivity(d){
  const days=(+d.runDays||0)+(+d.liftDays||0);
  return days>=10?"extra" : days>=7?"very" : days>=4?"moderate" : days>=2?"light" : "sedentary";
}
let onbStep=0, onbData={trackFC:true};
/* Only the questions that apply to the answers given so far (e.g. breastfeeding
   is asked only after "Female"). Everything downstream indexes into this. */
function activeOnb(){ return ONB.filter(q=>!q.when||q.when(onbData)); }
const ONB_TOTAL=()=>activeOnb().length+3;
function onbShell(inner){
  const t=ONB_TOTAL();
  return `<div style="padding-top:calc(env(safe-area-inset-top) + 42px)">
    <div class="bar" style="margin-bottom:26px"><i style="width:${(onbStep/t)*100}%;background:var(--run)"></i></div>
    <div class="tiny" style="margin-bottom:6px">STEP ${Math.min(onbStep+1,t)} OF ${t}</div>${inner}</div>`;
}
function renderOnboarding(){
  const QS=activeOnb();
  if(onbStep<QS.length){
    const s=QS[onbStep];
    return onbShell(`<h1 style="margin:0 0 ${s.note?"10":"20"}px;font-size:27px;letter-spacing:-.7px">${s.q}</h1>
      ${s.note?`<p class="muted" style="margin:0 0 18px;line-height:1.5">${s.note}</p>`:""}
      ${s.o.map(o=>`<button class="opt ${onbData[s.k]===o[0]?"sel":""}" onclick="onbPick('${s.k}',${typeof o[0]==="number"?o[0]:`'${o[0]}'`})">
        <b>${o[1]}</b>${o[2]?`<span>${o[2]}</span>`:""}</button>`).join("")}`);
  }

  /* ---- body measurements: the four inputs the calorie math needs ---- */
  if(onbStep===QS.length){
    const p=S.profile, ft=Math.floor((p.heightIn||0)/12), inch=(p.heightIn||0)%12;
    return onbShell(`<h1 style="margin:0 0 8px;font-size:27px;letter-spacing:-.7px">Your measurements</h1>
      <p class="muted" style="margin:0 0 20px;line-height:1.5">Height, weight and age go into the same equation clinics use. Nothing here leaves your phone.</p>
      <label class="lb">Height</label>
      <div class="hstack" style="margin-bottom:14px">
        <div><input class="fld" id="oft" type="number" inputmode="numeric" placeholder="5" value="${ft||""}"></div>
        <div><input class="fld" id="oin" type="number" inputmode="decimal" placeholder="11" value="${p.heightIn?inch:""}"></div>
      </div>
      <div class="tiny" style="margin:-8px 0 14px 2px">Feet and inches</div>
      <div class="hstack" style="margin-bottom:14px">
        <div><label class="lb">Bodyweight (lb)</label>
          <input class="fld" id="obw" type="number" inputmode="decimal" value="${p.bodyweight||175}"></div>
        <div><label class="lb">Age</label>
          <input class="fld" id="oage" type="number" inputmode="numeric" placeholder="32" value="${p.age||""}"></div>
      </div>
      <label class="lb">Body fat % — optional, but it upgrades everything</label>
      <input class="fld" id="obf" type="number" inputmode="decimal" placeholder="Skip if you don't know" value="${p.bodyFat||""}" style="margin-bottom:8px">
      <div class="tiny" style="margin:0 0 18px 2px;line-height:1.5">With body fat we switch to a lean-mass equation, which is more accurate for trained people and needs no sex adjustment at all.</div>
      <button class="btn p" onclick="grabBody()">Continue</button>`);
  }

  /* ---- resting calories (their number, not the equation's) + goal ---- */
  if(onbStep===QS.length+1){
    if(!Fuel.ready()) return onbShell(`<h1 style="margin:0 0 8px;font-size:27px">Something's missing</h1>
      <p class="muted" style="margin:0 0 20px">Go back and check your height, weight and age.</p>
      <button class="btn g" onclick="onbStep--;paintOnb()">Back</button>`);
    const est=Fuel.bmrAuto();
    const t=Fuel.compute();
    const goal=S.profile.calGoal||"maintain";
    const goals=[["lose","Deficit","Below resting — lose fat"],
                 ["maintain","Maintain","Right at your resting calories"],
                 ["gain","Bulk","Above resting — build"]];
    return onbShell(`<h1 style="margin:0 0 8px;font-size:27px;letter-spacing:-.7px">Your resting calories</h1>
      <p class="muted" style="margin:0 0 16px;line-height:1.5">This is what your body burns at rest — the number everything else is built on. We <b>estimated ${est.toLocaleString()}</b> from your height, weight and age, but if you've had it measured (a metabolic test or a wearable you trust), enter your own instead.</p>
      <label class="lb">Resting calories a day</label>
      <input class="fld" id="orest" type="number" inputmode="numeric" value="${(S.profile.bmrManual&&+S.profile.bmrCustom>0)?+S.profile.bmrCustom:est}" style="margin-bottom:6px">
      <div class="tiny" style="margin:0 0 16px 2px;line-height:1.5">Tap a goal to lock it in — you can change all of this in Settings later.</div>
      <label class="lb">Your goal</label>
      ${goals.map(g=>`<button class="opt ${goal===g[0]?"sel":""}" onclick="onbGoal('${g[0]}')">
        <b>${g[1]}</b><span>${g[2]}</span></button>`).join("")}
      <div class="card" style="text-align:center;padding:20px 16px;margin-top:4px">
        <div class="big" style="color:var(--run)">${t.target.toLocaleString()}</div>
        <div class="muted" style="margin-top:6px">calories a day · ${goal==="lose"?"deficit":goal==="gain"?"bulk":"maintain"}</div>
        <div class="grid2" style="gap:10px;margin-top:16px">
          <div class="stat" style="background:#101722"><b style="color:var(--hyb)">${t.protein}g</b><span>Protein</span></div>
          <div class="stat" style="background:#101722"><b>${t.carbs}g</b><span>Carbs</span></div>
        </div>
        <div class="tiny" style="margin-top:10px">Fat ${t.fat}g · Fibre ${t.fiber}g</div>
      </div>
      <button class="opt ${onbData.trackFC?"sel":""}" style="margin-top:6px" onclick="onbData.trackFC=!onbData.trackFC;paintOnb()">
        <b>${onbData.trackFC?"✓ ":""}Show carbs &amp; fat on the Fuel tab</b><span>Calories and protein show either way</span></button>
      <button class="btn p" style="margin-top:14px" onclick="grabRest()">Looks right</button>
      <div class="tiny" style="margin-top:14px;line-height:1.55;text-align:center">
        Your active/working calories — your job plus the runs and lifts you log — show separately on the Fuel tab, so you always see your full daily burn on top of this.</div>`);
  }

  return onbShell(`<h1 style="margin:0 0 8px;font-size:27px;letter-spacing:-.7px">What should we call you?</h1>
    <p class="muted" style="margin:0 0 20px">This is the name on the leaderboard.</p>
    <input class="fld" id="oname" placeholder="Display name" maxlength="22" style="margin-bottom:16px">
    <button class="btn p" onclick="finishOnb()">Start at Level 1</button>`);
}
/* Answers land on the live profile as they are given, so the preview on the
   targets step is computed by the same engine the app runs on. */
function onbPick(k,v){ onbData[k]=v; S.profile[k]=v; onbStep++; paintOnb(); }
function onbGoal(g){
  const r=+((document.getElementById("orest")||{}).value)||Fuel.bmrAuto();
  S.profile.bmrManual=true; S.profile.bmrCustom=r;
  S.profile.calGoal=g;
  S.profile.calTarget = g==="maintain"? r : g==="lose"? Math.max(0,r-500) : r+300;
  Object.assign(onbData,{bmrManual:true,bmrCustom:r,calGoal:g,calTarget:S.profile.calTarget});
  paintOnb();
}
function grabRest(){
  const r=+((document.getElementById("orest")||{}).value)||0;
  if(r<800||r>5000){ toast("Check your resting calories","Somewhere between 800 and 5,000."); return; }
  const g=S.profile.calGoal||"maintain";
  S.profile.bmrManual=true; S.profile.bmrCustom=r; S.profile.calGoal=g;
  S.profile.calTarget = g==="maintain"? r : g==="lose"? Math.max(0,r-500) : r+300;
  Object.assign(onbData,{bmrManual:true,bmrCustom:r,calGoal:g,calTarget:S.profile.calTarget});
  onbStep++; paintOnb();
}
function grabBody(){
  const v=id=>{ const e=document.getElementById(id); return e? +e.value||0 : 0; };
  const ft=v("oft"), inch=v("oin"), bw=v("obw"), age=v("oage"), bf=v("obf");
  const heightIn=ft*12+inch;
  if(heightIn<48||heightIn>90){ toast("Check your height","Somewhere between 4'0\" and 7'6\"."); return; }
  if(bw<70||bw>600){ toast("Check your bodyweight","Enter it in pounds."); return; }
  if(age<13||age>100){ toast("Check your age","Enter your age in years."); return; }
  if(bf&&(bf<3||bf>70)){ toast("Check your body fat %","Leave it blank if you're not sure."); return; }
  Object.assign(onbData,{heightIn,bodyweight:bw,age,ageYear:new Date().getFullYear(),bodyFat:bf,
    activity:suggestActivity(onbData)});
  Object.assign(S.profile,onbData);
  onbStep++; paintOnb();
}
function paintOnb(){
  vp().innerHTML=`<div class="view fade-enter">${renderOnboarding()}</div>`;
  $("#tabs").style.display="none"; $("#fab").style.display="none";
}
function finishOnb(){
  const n=document.getElementById("oname").value.trim();
  if(!n){ toast("Name required","Enter a display name to continue."); return; }
  S.profile=Object.assign(S.profile,onbData,{name:n,proteinManual:false});
  const t=fuelTargets();
  if(t) S.profile.proteinTarget=t.protein;   // a sane starting point if they ever go manual
  // Seed the weight log: today's bodyweight is the starting weight.
  if(!S.weightLog.length && +S.profile.bodyweight>0)
    S.weightLog=[{date:new Date().toISOString(), w:+S.profile.bodyweight}];
  S.onboarded=true; save();
  route={page:"home",param:null}; paint();
  toast("Welcome, "+n,t?`${t.target.toLocaleString()} kcal · ${t.protein}g protein to start.`:"You're Level 1 across the board. Go earn it.");
}

/* ============================================================
   HOME — customizable widget board
   ============================================================ */
const WIDGETS={
  hybrid:{name:"Hybrid Index",desc:"Your headline all-around score",render(){
    const st=stats();
    return card(`<div class="ctitle">Hybrid Index</div>
      <div class="row"><div>
        <div class="big" style="color:var(--hyb)">${st.hybrid.toFixed(2)}</div>
        <div class="muted" style="margin-top:7px">Run L${st.run.level} · Strength L${fmt(st.strLevel,1)}</div>
        <div class="tiny" style="margin-top:5px">${balanceNote(st)}</div>
      </div>${ring(Math.min(1,st.hybrid/20),"index",st.hybrid.toFixed(1),"var(--hyb)",96,9)}</div>`,"tree")}},

  levels:{name:"Level Rings",desc:"Running + strength — tap to open full stats",render(){
    const st=stats();
    const sInfo=strengthProgress(st);
    return `<div class="grid2" style="margin-bottom:12px">
      <div class="card tap" style="margin:0;text-align:center" data-go="running">
        ${ring(st.run.pct,"Running","L"+st.run.level,"var(--run)",108,10)}
        <div class="muted" style="margin-top:11px;font-size:12.5px">${fmt(st.run.need,1)} mi to L${st.run.level+1}</div></div>
      <div class="card tap" style="margin:0;text-align:center" data-go="strength">
        ${ring(sInfo.pct,"Strength","L"+fmt(st.strLevel,1),"var(--str)",108,10)}
        <div class="muted" style="margin-top:11px;font-size:12.5px">${st.trained.length} movement${st.trained.length===1?"":"s"} trained</div></div></div>`}},

  week:{name:"This Week",desc:"Runs, lifts and volume over 7 days",render(){
    const rs=runsSince(weekAgo(6)), ls=liftsSince(weekAgo(6));
    const mi=rs.reduce((a,r)=>a+r.miles,0), vol=ls.reduce((a,l)=>a+l.vol,0);
    return card(`<div class="ctitle">This Week <span style="color:var(--dim2)">${S.profile.runDays}× run · ${S.profile.liftDays}× lift plan</span></div>
      <div class="grid2" style="gap:10px">
        <div class="stat" style="background:#101722"><b style="color:var(--run)">${fmt(mi,1)}</b><span>Miles</span></div>
        <div class="stat" style="background:#101722"><b style="color:var(--str)">${(vol/1000).toFixed(1)}k</b><span>Volume lb</span></div>
        <div class="stat" style="background:#101722"><b>${rs.length}</b><span>Runs</span></div>
        <div class="stat" style="background:#101722"><b>${ls.length}</b><span>Lifts</span></div></div>`)}},

  protein:{name:"Fuel Today",desc:"Calories and protein against today's targets",render(){
    const m=dayFuel(), t=fuelTargets(), pGoal=proteinGoal(t);
    const pPct=Math.min(1,m.p/(pGoal||1));
    if(!t) return card(`<div class="ctitle">Fuel Today</div>
      <div style="font-size:27px;font-weight:800;letter-spacing:-1px">${Math.round(m.p)}<span style="font-size:15px;color:var(--dim)"> / ${pGoal}g protein</span></div>
      <div class="bar" style="margin-top:11px"><i style="width:${pPct*100}%;background:var(--hyb)"></i></div>
      <div class="tiny" style="margin-top:9px">Add your height and age in Settings to track calories too.</div>`,"fuel");
    const cPct=Math.min(1,m.kcal/(t.target||1));
    return card(`<div class="ctitle">Fuel Today
        <span style="color:var(--dim2)">${t.active>0?`+${t.active.toLocaleString()} active burn`:""}</span></div>
      <div class="row" style="margin-bottom:4px">
        <span style="font-size:25px;font-weight:800;letter-spacing:-1px">${Math.round(m.kcal).toLocaleString()}<span style="font-size:14px;color:var(--dim)"> / ${t.target.toLocaleString()}</span></span>
        <span class="tiny">${Math.max(0,Math.round(t.target-m.kcal)).toLocaleString()} left</span></div>
      <div class="bar" style="margin-bottom:14px"><i style="width:${cPct*100}%;background:var(--run)"></i></div>
      <div class="row" style="margin-bottom:4px">
        <span style="font-size:19px;font-weight:750;letter-spacing:-.5px">${Math.round(m.p)}<span style="font-size:13px;color:var(--dim)"> / ${pGoal}g protein</span></span>
        <span class="tiny">${Math.max(0,Math.round(pGoal-m.p))}g left</span></div>
      <div class="bar"><i style="width:${pPct*100}%;background:var(--hyb)"></i></div>
      ${S.profile.trackFC?`<div class="muted" style="margin-top:10px;font-size:12px">Carbs ${Math.round(m.c)} / ${t.carbs}g · Fat ${Math.round(m.f)} / ${t.fat}g</div>`:""}`,"fuel")}},

  activity:{name:"Recent Activity",desc:"Your latest runs and lifts",render(){
    const items=recentActivity(4);
    return card(`<div class="ctitle">Recent Activity</div>
      ${items.length?items.map(a=>`<div class="lrow">
        <span class="dot" style="background:${a.t==="run"?"var(--run)":"var(--str)"}"></span>
        <div class="nm"><b>${esc(a.title)}</b><div class="tiny">${a.sub}</div></div>
        <div class="tiny">${a.when}</div></div>`).join(""):`<div class="empty">Nothing logged yet.<br>Hit ＋ to log your first session.</div>`}`)}},

  routines:{name:"Quick Start",desc:"Launch a saved routine in one tap",render(){
    return card(`<div class="ctitle">Quick Start</div>
      ${S.routines.length?S.routines.slice(0,3).map((r,i)=>`<div class="lrow">
        <div class="nm"><b>${esc(r.name)}</b><div class="tiny">${routineSub(r)}</div></div>
        <button class="lvpill s" data-start="${i}" style="padding:7px 13px">Start</button></div>`).join("")
        :`<div class="empty">No routines yet.<br>Build one in the Train tab.</div>`}`,"train")}},

  streak:{name:"Training Streak",desc:"Consecutive days with a session logged",render(){
    const s=streak();
    return card(`<div class="ctitle">Streak</div>
      <div class="row"><div><div class="big" style="color:var(--warn)">${s.cur}</div>
      <div class="muted" style="margin-top:6px">day streak · best ${s.best}</div></div>
      <div style="text-align:right"><div class="tiny">LAST 14 DAYS</div>
      <div style="display:flex;gap:3px;margin-top:8px">${s.grid.map(d=>`<span style="width:9px;height:22px;border-radius:3px;background:${d?"var(--warn)":"#1e2734"}"></span>`).join("")}</div></div></div>`)}},

  nextlvl:{name:"Closest Level Up",desc:"What you're nearest to unlocking",render(){
    const st=stats(), n=closestLevelUps(st).slice(0,3);
    return card(`<div class="ctitle">Closest Level Ups</div>
      ${n.map(x=>`<div style="margin-bottom:12px"><div class="row" style="margin-bottom:6px">
        <b style="font-size:13.5px">${esc(x.label)}</b><span class="tiny">${x.left}</span></div>
        <div class="bar"><i style="width:${x.pct*100}%;background:${x.color}"></i></div></div>`).join("")}`)}},

  rank:{name:"Your Rank",desc:"Where you sit on the leaderboard",render(){
    const b=board(); const me=b.findIndex(x=>x.me)+1;
    return card(`<div class="ctitle">Leaderboard</div>
      <div class="row"><div><div class="big">#${me}</div><div class="muted" style="margin-top:6px">of ${b.length} hybrid athletes</div></div>
      <div style="text-align:right"><div class="tiny">TOP</div><div style="font-weight:700;margin-top:5px">${esc(b[0].name)}</div>
      <div class="tiny">${b[0].hy.toFixed(2)} index</div></div></div>`,"ranks")}},

  prs:{name:"Recent PRs",desc:"Heaviest set logged per movement",render(){
    const p=prList().slice(0,4);
    return card(`<div class="ctitle">Personal Bests</div>
      ${p.length?p.map(x=>`<div class="lrow"><div class="nm"><b>${esc(x.name)}</b><div class="tiny">${x.group}</div></div>
        <span class="lvpill s">${x.w} lb × ${x.r}</span></div>`).join(""):`<div class="empty">Log a lift to set your first PR.</div>`}`)}},

  mileage:{name:"Weekly Mileage",desc:"7-day running bar chart",render(){
    const d=last7Miles(), mx=Math.max(1,...d.map(x=>x.mi));
    return card(`<div class="ctitle">Last 7 Days <span style="color:var(--run)">${fmt(d.reduce((a,x)=>a+x.mi,0),1)} mi</span></div>
      <div class="spark">${d.map(x=>`<div style="height:${Math.max(4,(x.mi/mx)*100)}%;background:${x.mi?"var(--run)":"#233043"}"></div>`).join("")}</div>
      <div style="display:flex;gap:5px">${d.map(x=>`<div class="tiny" style="flex:1;text-align:center">${x.d}</div>`).join("")}</div>`,"running")}}
};
function card(inner,go){ return `<div class="card${go?" tap":""}" ${go?`data-go="${go}"`:""}>${inner}${go?`<div style="position:absolute"></div>`:""}</div>`; }

function balanceNote(st){
  const gap=Math.abs(st.run.level-st.strLevel);
  if(gap<1) return "Perfectly balanced — full index value.";
  const pen=Math.min(.25,(gap/(st.run.level+st.strLevel))*.5);
  const side=st.run.level>st.strLevel?"lifting":"running";
  return `−${Math.round(pen*100)}% balance penalty · more ${side} closes the gap.`;
}
function strengthProgress(st){
  // progress of the "average" movement toward its next level
  const t=st.trained;
  if(!t.length) return {pct:0};
  const p=t.map(k=>Level.str(S.movements[k].volume).pct);
  return {pct:p.reduce((a,b)=>a+b,0)/p.length};
}
function recentActivity(n){
  const a=[...S.runLog.map(r=>({t:"run",date:r.date,title:`${fmt(r.miles,2)} mi run`,sub:`${r.min} min · ${pace(r.miles,r.min)}/mi`})),
           ...S.liftLog.map(l=>({t:"lift",date:l.date,title:l.move,sub:`${l.sets.length} sets · ${Math.round(l.vol).toLocaleString()} lb volume`}))];
  a.sort((x,y)=>new Date(y.date)-new Date(x.date));
  return a.slice(0,n).map(x=>Object.assign(x,{when:ago(x.date)}));
}
function ago(d){
  const ms=Date.now()-new Date(d).getTime(), h=ms/36e5;
  if(h<1) return Math.max(1,Math.round(ms/6e4))+"m";
  if(h<24) return Math.round(h)+"h";
  return Math.round(h/24)+"d";
}
function streak(){
  const days=new Set([...S.runLog.map(r=>dkey(r.date)),...S.liftLog.map(l=>dkey(l.date))]);
  let cur=0; const d=new Date(); d.setHours(0,0,0,0);
  if(!days.has(dkey(d))) d.setDate(d.getDate()-1);
  while(days.has(dkey(d))){ cur++; d.setDate(d.getDate()-1); }
  let best=cur; const all=[...days].sort(); let run=0, prev=null;
  all.forEach(k=>{ const t=new Date(k).getTime();
    run = (prev && t-prev===864e5)? run+1 : 1; prev=t; best=Math.max(best,run); });
  const grid=[]; for(let i=13;i>=0;i--){ const x=new Date(); x.setHours(0,0,0,0); x.setDate(x.getDate()-i); grid.push(days.has(dkey(x))); }
  return {cur,best,grid};
}
function closestLevelUps(st){
  const out=[{label:"Running",left:fmt(st.run.need,1)+" mi to L"+(st.run.level+1),pct:st.run.pct,color:"var(--run)"}];
  st.trained.forEach(k=>{ const p=Level.str(S.movements[k].volume);
    out.push({label:k,left:p.need.toLocaleString()+" lb to L"+(p.level+1),pct:p.pct,color:"var(--str)"}); });
  return out.sort((a,b)=>b.pct-a.pct);
}
function prList(){
  return Object.keys(S.movements).filter(k=>S.movements[k].best)
    .map(k=>({name:k,group:(LIBMAP[k]||{}).group||"Other",w:S.movements[k].best.w,r:S.movements[k].best.r}))
    .sort((a,b)=>b.w-a.w);
}
function last7Miles(){
  const L=["S","M","T","W","T","F","S"], out=[];
  for(let i=6;i>=0;i--){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    const k=dkey(d), mi=S.runLog.filter(r=>dkey(r.date)===k).reduce((a,r)=>a+r.miles,0);
    out.push({d:L[d.getDay()],mi}); }
  return out;
}
function routineSub(r){
  const parts=[];
  if(r.exercises.length) parts.push(r.exercises.length+" exercise"+(r.exercises.length===1?"":"s"));
  if(r.run&&r.run.miles) parts.push(r.run.miles+" mi "+(r.run.when==="before"?"before":"after"));
  return parts.join(" · ")||"Empty routine";
}

</script>
<script>
/* ============================================================
   PAGES
   ============================================================ */
const PAGES={}, AFTER={};

/* ---------------- HOME (customizable board) ---------------- */
PAGES.home=function(){
  const h=new Date().getHours();
  const greet=h<12?"Good morning":h<18?"Good afternoon":"Good evening";
  const board=S.layout.map(k=>WIDGETS[k]?`<div class="wgt" data-w="${k}"><button class="rm" data-rm="${k}">×</button>${WIDGETS[k].render()}</div>`:"").join("");
  return head(editing?"Edit Home":greet, editing?"Drag to reorder · × to remove":esc(S.profile.name))
    + (editing?`<div class="editbar">
         <button class="btn g sm" onclick="openGallery()">+ Add Widget</button>
         <button class="btn p sm" onclick="setEdit(false)">Done</button></div>`:"")
    + `<div id="wlist">${board}</div>`
    + (editing?`<button class="btn ghost sm" onclick="resetLayout()" style="margin-bottom:20px">Reset to default layout</button>`
              :`<button class="btn ghost sm" onclick="setEdit(true)" style="margin-bottom:20px">Edit home screen</button>`);
};
AFTER.home=function(){
  const list=document.getElementById("wlist");
  if(!list) return;
  list.addEventListener("click",e=>{
    const rm=e.target.closest("[data-rm]");
    if(rm){ S.layout=S.layout.filter(x=>x!==rm.dataset.rm); save(); repaint(); return; }
    if(editing) return;
    const st=e.target.closest("[data-start]");
    if(st){ startRoutine(+st.dataset.start); return; }
    const go=e.target.closest("[data-go]");
    if(go) nav(go.dataset.go,null);
  });
  wireDrag(list);
};
function setEdit(on){
  editing=on;
  document.body.classList.toggle("editing",on);
  repaint();
}
function resetLayout(){ S.layout=DEFAULT_WIDGETS.slice(); save(); repaint(); toast("Layout reset"); }
function openGallery(){
  const avail=Object.keys(WIDGETS).filter(k=>!S.layout.includes(k));
  sheet(`<h3>Add a widget</h3>${
    avail.length?avail.map(k=>`<button class="gal" onclick="addWidget('${k}')">
      <div style="flex:1"><b>${WIDGETS[k].name}</b><span>${WIDGETS[k].desc}</span></div><span class="add">+</span></button>`).join("")
    :`<div class="empty">Every widget is already on your home screen.</div>`}
    <button class="btn g sm" style="margin-top:8px" onclick="closeSheet()">Close</button>`);
}
function addWidget(k){ if(!S.layout.includes(k)) S.layout.push(k); save(); closeSheet(); repaint(); }

/* -------- long-press + drag-to-reorder (pointer based: mouse & touch) -------- */
function wireDrag(list){
  list.addEventListener("pointerdown",e=>{
    const w=e.target.closest(".wgt"); if(!w) return;
    if(e.target.closest("[data-rm]")) return;
    const y0=e.clientY, hold=editing?150:520;
    let timer=setTimeout(()=>{
      timer=null; cleanup();
      if(navigator.vibrate) navigator.vibrate(editing?8:14);
      if(editing) startDrag(e,w); else setEdit(true);
    },hold);
    const mv=ev=>{ if(Math.abs(ev.clientY-y0)>9){ clearTimeout(timer); timer=null; cleanup(); } };
    const up=()=>{ clearTimeout(timer); timer=null; cleanup(); };
    function cleanup(){ list.removeEventListener("pointermove",mv);
      list.removeEventListener("pointerup",up); list.removeEventListener("pointercancel",up); }
    list.addEventListener("pointermove",mv);
    list.addEventListener("pointerup",up);
    list.addEventListener("pointercancel",up);
  });
  function startDrag(e,el){
    const dg={el,startY:e.clientY};
    el.classList.add("drag");
    el.style.touchAction="none";
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    const move=ev=>{
      ev.preventDefault();
      const dy=ev.clientY-dg.startY;
      el.style.transform=`translateY(${dy}px) scale(1.035)`;
      const box=el.getBoundingClientRect(), cy=box.top+box.height/2;
      for(const s of [...list.children]){
        if(s===el) continue;
        const r=s.getBoundingClientRect();
        if(cy>r.top && cy<r.bottom){
          const before=cy<r.top+r.height/2;
          const oldTop=box.top-dy;
          const sTop=r.top;
          if(before) list.insertBefore(el,s); else list.insertBefore(el,s.nextSibling);
          // FLIP the displaced sibling so it glides
          const nr=s.getBoundingClientRect();
          s.style.transition="none"; s.style.transform=`translateY(${sTop-nr.top}px)`;
          requestAnimationFrame(()=>{ s.style.transition="transform .2s cubic-bezier(.22,.61,.36,1)"; s.style.transform=""; });
          // keep the dragged card visually still
          el.style.transform="";
          const nb=el.getBoundingClientRect();
          dg.startY += nb.top-oldTop;
          el.style.transform=`translateY(${ev.clientY-dg.startY}px) scale(1.035)`;
          break;
        }
      }
    };
    const up=()=>{
      el.removeEventListener("pointermove",move);
      el.removeEventListener("pointerup",up);
      el.removeEventListener("pointercancel",up);
      el.style.transition="transform .18s ease";
      el.style.transform="";
      el.style.touchAction="";
      setTimeout(()=>{ el.style.transition=""; el.classList.remove("drag"); },190);
      S.layout=[...list.children].map(c=>c.dataset.w).filter(Boolean);
      save();
    };
    el.addEventListener("pointermove",move);
    el.addEventListener("pointerup",up);
    el.addEventListener("pointercancel",up);
  }
}

function ladderRun(cur){
  const rows=[]; let lv=1, floor=0;
  while(lv<cur+4){ const inc=Level.runIncrement(lv); floor+=inc; lv++;
    if(lv>=Math.max(2,cur-1)) rows.push({lv,mi:floor});
    if(rows.length>6) break; }
  return rows.map(r=>`<div class="lrow"><div class="nm"><b>Level ${r.lv}</b></div>
    <span class="lvpill ${r.lv<=cur?"r":""}">${r.lv<=cur?"✓ ":""}${fmt(r.mi,0)} mi</span></div>`).join("");
}

/* Calories for one logged item. Entries from before calorie tracking existed
   have no stored value, so fall back to 4/4/9 rather than counting them as zero. */
function foodKcal(it){
  return it.kcal!=null ? it.kcal : (it.p||0)*4+(it.c||0)*4+(it.f||0)*9;
}
function addFoodSheet(){
  const fc=S.profile.trackFC;
  sheet(`<h3>Add food</h3>
    <label class="lb">Name</label><input class="fld" id="fn" placeholder="Chicken, shake, bar…" style="margin-bottom:12px">
    <div class="hstack" style="margin-bottom:12px">
      <div><label class="lb">Calories</label><input class="fld" id="fk" type="number" inputmode="numeric" placeholder="auto"></div>
      <div><label class="lb">Protein (g)</label><input class="fld" id="fp" type="number" inputmode="decimal" oninput="autoKcal()"></div>
    </div>
    ${fc?`<div class="hstack" style="margin-bottom:12px">
      <div><label class="lb">Carbs (g)</label><input class="fld" id="fc" type="number" inputmode="decimal" oninput="autoKcal()"></div>
      <div><label class="lb">Fat (g)</label><input class="fld" id="ff" type="number" inputmode="decimal" oninput="autoKcal()"></div></div>`:""}
    <div class="tiny" style="margin:-4px 0 14px 2px">Leave calories blank and we'll work them out from the macros.</div>
    <button class="btn p" onclick="addFood()">Add</button>`,
    {after:s=>{ const i=s.querySelector("#fn"); i&&i.focus(); }});
}
/* Live estimate in the calories placeholder as macros get typed. */
function autoKcal(){
  const g=id=>+((document.getElementById(id)||{}).value)||0;
  const est=g("fp")*4+g("fc")*4+g("ff")*9;
  const k=document.getElementById("fk");
  if(k) k.placeholder = est>0 ? String(Math.round(est)) : "auto";
}
function addFood(){
  const g=id=>+((document.getElementById(id)||{}).value)||0;
  const n=document.getElementById("fn").value.trim()||"Food";
  const p=g("fp"), f=g("ff"), c=g("fc");
  const kcal = g("fk") || Math.round(p*4+c*4+f*9);
  if(!p&&!f&&!c&&!kcal){ toast("Nothing to log","Add calories or macros."); return; }
  const k=todayKey();
  const m = S.macros[k] = S.macros[k]||{p:0,f:0,c:0,items:[]};
  if(m.kcal==null) m.kcal=(m.p||0)*4+(m.c||0)*4+(m.f||0)*9;  // backfill legacy days
  m.items.push({name:n,p,f,c,kcal});
  m.p+=p; m.f+=f; m.c+=c; m.kcal+=kcal;
  save(); closeSheet(); repaint();
  toast("Logged "+n, kcal?`${Math.round(kcal)} kcal · ${p}g protein`:`${p}g protein`);
}
function delFood(i){
  const k=todayKey(), m=S.macros[k]; if(!m) return;
  const it=m.items[i]; if(!it) return;
  if(m.kcal==null) m.kcal=(m.p||0)*4+(m.c||0)*4+(m.f||0)*9;
  m.p-=it.p||0; m.f-=it.f||0; m.c-=it.c||0; m.kcal=Math.max(0,m.kcal-foodKcal(it));
  m.items.splice(i,1);
  save(); repaint();
}

/* ---- breastfeeding tracker (Fuel tab) ---- */
function bfCountToday(){
  const d=S.macros[todayKey()];
  if(d&&d.bf!=null) return d.bf;              // an explicit count for today
  return +S.profile.feedsPerDay||0;           // else the signup average
}
function isBreastfeeding(){ return S.profile.sex==="female" && S.profile.breastfeeding==="yes"; }
function setBf(delta){
  const k=todayKey();
  const m = S.macros[k] = S.macros[k]||{p:0,f:0,c:0,items:[]};
  const cur = m.bf!=null ? m.bf : (+S.profile.feedsPerDay||0);
  m.bf = Math.max(0, cur+delta);
  save(); repaint();
}
function bfCard(){

/* ---- goal / target (anchored to resting) ---- */
function setGoal(g){
  const r=Math.round(Fuel.bmr().v);
  S.profile.calGoal=g;
  S.profile.calTarget = g==="maintain"? r : g==="lose"? Math.max(0,r-500) : r+300;
  save(); repaint();
}
function setTargetCals(v){
  const r=Math.round(Fuel.bmr().v), n=Math.round(+v||0);
  if(n<=0){ repaint(); return; }
  S.profile.calTarget=n;
  S.profile.calGoal = n < r-20 ? "lose" : n > r+20 ? "gain" : "maintain";
  save(); repaint();
}

/* ---- weight tracking + trend graph (Fuel tab) ---- */
function weightCard(){
  const log=(S.weightLog||[]).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  const start=log[0], cur=log[log.length-1];
  const startW=start?start.w:(+S.profile.bodyweight||0);
  const curW=cur?cur.w:startW;
  const delta=+(curW-startW).toFixed(1);
  const dcol=delta<0?"var(--hyb)":delta>0?"var(--str)":"var(--dim)";
  const startDate=start?new Date(start.date):null;
  return `<div class="card"><div class="ctitle">Weight${startDate?` <span style="color:var(--dim2)">since ${startDate.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"2-digit"})}</span>`:""}</div>
    <div class="grid2" style="gap:10px;margin-bottom:10px">
      <div class="stat" style="background:#101722"><b>${startW?startW.toLocaleString():"—"}</b><span>Starting lb</span></div>
      <div class="stat" style="background:#101722"><b style="color:${dcol}">${curW?curW.toLocaleString():"—"}</b><span>Current lb</span></div>
    </div>
    <div class="row" style="margin-bottom:12px">
      <span class="muted" style="font-size:13px">Change from start</span>
      <span style="font-weight:800;color:${dcol}">${delta>0?"+":""}${delta} lb</span></div>
    ${weightGraphSVG(log)}
    <button class="btn g sm" style="margin-top:12px" onclick="logWeightSheet()">Update current weight</button>
  </div>`;
}
function weightGraphSVG(log){
  if(!log.length) return `<div class="empty" style="padding:12px 0">No weigh-ins yet.</div>`;
  const W=320,H=118,pad=8,padL=30,padB=16;
  const ts=log.map(e=>new Date(e.date).getTime());
  let mn=Math.min.apply(null,log.map(e=>e.w)), mx=Math.max.apply(null,log.map(e=>e.w));
  if(mx-mn<2){ mn-=1; mx+=1; }
  const t0=ts[0], t1=ts[ts.length-1], span=Math.max(1,t1-t0);
  const x=i=> padL+(span?(ts[i]-t0)/span:0)*(W-padL-pad);
  const y=w=> pad+(1-(w-mn)/(mx-mn))*(H-pad-padB);
  const start=log[0].w, cur=log[log.length-1].w;
  const col=cur<start?"#25d366":cur>start?"#3d8bff":"#8b97a8";
  const by=y(start);
  const fmtD=d=>d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
  const pts=log.map((e,i)=>`${x(i).toFixed(1)},${y(e.w).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
    <line x1="${padL}" y1="${by.toFixed(1)}" x2="${W-pad}" y2="${by.toFixed(1)}" stroke="#2a3644" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="${padL-4}" y="${(by+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#5d6878">${Math.round(start)}</text>
    ${log.length>1?`<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:""}
    ${log.map((e,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(e.w).toFixed(1)}" r="${i===log.length-1?3.5:2}" fill="${col}"/>`).join("")}
    <text x="${padL}" y="${H-3}" font-size="9" fill="#5d6878">${fmtD(new Date(log[0].date))}</text>
    ${log.length>1?`<text x="${W-pad}" y="${H-3}" text-anchor="end" font-size="9" fill="#5d6878">${fmtD(new Date(log[log.length-1].date))}</text>`:""}
  </svg>`;
}
function logWeightSheet(){
  sheet(`<h3>Update weight</h3>
    <label class="lb">Current bodyweight (lb)</label>
    <input class="fld" id="wnew" type="number" inputmode="decimal" value="${+S.profile.bodyweight||""}" style="margin-bottom:6px">

    <button class="btn p" onclick="applyWeight()">Save weigh-in</button>`,
    {after:s=>{ const i=s.querySelector("#wnew"); if(i){ i.focus(); i.select&&i.select(); } }});
}
function applyWeight(){
  const w=+gv("wnew")||0;
  if(w<50||w>800){ toast("Check the weight","Enter it in pounds (50–800)."); return; }
  const k=todayKey();
  S.weightLog=S.weightLog||[];
  const idx=S.weightLog.findIndex(e=>dkey(e.date)===k);
  if(idx>=0) S.weightLog[idx].w=w; else S.weightLog.push({date:new Date().toISOString(),w});
  S.profile.bodyweight=w;   // keep the rest of the app in sync
  save(); closeSheet(); repaint();
  toast("Weight logged",w+" lb");
}

function saveFuel(){
  const g=id=>{ const e=document.getElementById(id); return e? e.value : null; };
  const n=id=>+g(id)||0;
  const heightIn=n("sft")*12+n("sin"), age=n("sage"), bf=n("sbf");
  if(heightIn && (heightIn<48||heightIn>90)){ toast("Check your height","Between 4'0\" and 7'6\"."); return; }
  if(age && (age<13||age>100)){ toast("Check your age"); return; }
  if(bf && (bf<3||bf>70)){ toast("Check your body fat %","Leave it blank if you're not sure."); return; }
  const p=S.profile;
  if(heightIn) p.heightIn=heightIn;
  if(age){ p.age=age; p.ageYear=new Date().getFullYear(); }
  p.bodyFat=bf;
  if(g("smodel")) p.calModel=g("smodel");
  if(g("sact")) p.activity=g("sact");
  if(g("sneat")) p.neat=g("sneat");
  if(g("sgoal")){
    p.calGoal=g("sgoal");
    if(p.calGoal==="maintain") p.calRate=0;
    else if(!p.calRate) p.calRate = p.calGoal==="lose"?.75:.25;
  }
  if(g("srate")!==null) p.calRate=Math.min(Math.abs(+g("srate")||0), p.calGoal==="lose"?1:.5);
  if(g("sp")!==null) p.proteinTarget=n("sp")||p.proteinTarget;
  if(g("sbmr")!==null){
    const bmr=n("sbmr");
    if(bmr && (bmr<800||bmr>4000)){ toast("Check your resting calories","A realistic BMR is roughly 800–4,000."); return; }
    p.bmrCustom=bmr;
  }
  if(g("sfeeds")!==null) p.feedsPerDay=n("sfeeds");
  save(); repaint();
  const t=fuelTargets();
  toast("Saved", t?`${t.target.toLocaleString()} kcal · ${proteinGoal(t)}g protein`:"");
}
