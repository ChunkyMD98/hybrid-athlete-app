function toggleSet(j,k){ const s=S.active.ex[j].sets[k]; s.done=!s.done; save(); repaint(); }
function addSet(j){ const e=S.active.ex[j], last=e.sets[e.sets.length-1]||{w:"",r:8};
  e.sets.push({w:last.w,r:last.r,done:false}); save(); repaint(); }
function addLiveEx(move){
  S.active.ex.push({move,sets:[{w:LIBMAP[move]&&LIBMAP[move].bw?S.profile.bodyweight:"",r:8,done:false}]});
  save(); closeSheet(); repaint();
}
function cancelWorkout(){ S.active=null; save(); nav("train",null); toast("Workout discarded"); }
function finishWorkout(){
  const a=S.active; if(!a) return;
  const before=snapshot();
  const runMin=+a.run.min||0;
  // Real session duration, minus any running, split across exercises by set
  // count — so the calorie side gets a measured number instead of an estimate.
  const elapsed=Math.max(0,Math.round((Date.now()-a.start)/60000)-runMin);
  const totalSets=a.ex.reduce((n,e)=>n+e.sets.filter(s=>s.done&&+s.w>0&&+s.r>0).length,0);
  let anySets=false;
  a.ex.forEach(e=>{
    const sets=e.sets.filter(s=>s.done && +s.w>0 && +s.r>0).map(s=>({w:+s.w,r:+s.r}));
    if(sets.length){
      anySets=true;
      const share = totalSets && elapsed ? Math.round(elapsed*sets.length/totalSets) : 0;
      applyLift(e.move,sets,true,share);
    }
  });
  const mi=+a.run.miles||0, min=+a.run.min||0;
  if(mi>0) applyRun(mi,min||Math.round(mi*9),true);
  if(!anySets && mi<=0){ toast("Nothing to log","Check off completed sets or add run distance."); return; }
  S.active=null; save();
  nav("home",null);
  setTimeout(()=>reportLevels(before,"Workout complete"),260);
}

/* ---------------- LOGGING ---------------- */
function snapshot(){
  const st=stats();
  return {run:st.run.level, str:st.strLevel, hy:st.hybrid,
          moves:Object.fromEntries(Object.keys(S.movements).map(k=>[k,Level.str(S.movements[k].volume).level]))};
}
function reportLevels(before,headline){
  const after=snapshot();
  const ups=[];
  if(after.run>before.run) ups.push("Running → L"+after.run);
  Object.keys(after.moves).forEach(k=>{ const b=before.moves[k]||1;
    if(after.moves[k]>b) ups.push(k+" → L"+after.moves[k]); });
  if(ups.length){ toast("LEVEL UP · "+ups.length, ups.join(" · ")); if(navigator.vibrate) navigator.vibrate([14,60,14]); }
  else if(headline) toast(headline,"Hybrid Index "+after.hy.toFixed(2));
  if(after.hy>before.hy+.0001 && ups.length) setTimeout(()=>toast("Hybrid Index "+after.hy.toFixed(2),"was "+before.hy.toFixed(2)),400);
}
function applyRun(miles,min,silent){
  const before=silent?null:snapshot();
  const b=Level.run(S.totals.miles).level;
  S.totals.miles+=miles; S.totals.runs++; S.totals.minutes+=min;
  const gained=Level.run(S.totals.miles).level-b;
  S.runLog.push({miles,min,date:new Date().toISOString(),gained});
  save();
  if(!silent){ repaint(); reportLevels(before,fmt(miles,2)+" mi logged"); }
}
function applyLift(move,sets,silent,min){
  const before=silent?null:snapshot();
  const vol=sets.reduce((a,s)=>a+s.w*s.r,0);
  const m=S.movements[move]||(S.movements[move]={volume:0,sets:0,best:null});
  m.volume+=vol; m.sets+=sets.length;
  const heaviest=sets.reduce((a,s)=>s.w>((a&&a.w)||0)?s:a,null);
  if(heaviest && (!m.best || heaviest.w>m.best.w)) m.best={w:heaviest.w,r:heaviest.r};
  S.totals.lifts++;
  S.liftLog.push({move,sets,vol,min:min||0,date:new Date().toISOString()});
  if(!LIBMAP[move]) LIBMAP[move]={name:move,group:"Other",bw:false};
  save();
  if(!silent){ repaint(); reportLevels(before,move+" logged"); }
}

function saveUsdaKey(){

async function usdaSearch(query){
  const key=(S.profile.usdaKey||"").trim();
  if(!key) throw new Error("no API key");
  const url="https://api.nal.usda.gov/fdc/v1/foods/search?api_key="+encodeURIComponent(key)
    +"&pageSize=1&query="+encodeURIComponent(query);
  const r=await fetch(url);
  if(!r.ok) throw new Error("USDA "+r.status+(r.status===403||r.status===401?" (bad key)":""));
  const d=await r.json();
  return (d.foods&&d.foods[0])||null;
}
/* USDA search returns nutrients per 100 g. Numbers: 208 kcal, 203 protein,
   204 fat, 205 carbs (957/958 are alternate energy fields). */
function usdaMacrosPer100(food){
  if(!food) return null;
  const by={};
  (food.foodNutrients||[]).forEach(n=>{ const num=String(n.nutrientNumber!=null?n.nutrientNumber:(n.number!=null?n.number:"")); if(num) by[num]=n.value; });
  const kcal = by["208"]!=null?by["208"] : by["957"]!=null?by["957"] : by["958"]!=null?by["958"] : 0;
  return {kcal:+kcal||0, p:+by["203"]||0, f:+by["204"]||0, c:+by["205"]||0};
}
async function usdaTest(){
  toast("Testing…","Contacting USDA.");
  try{
    const f=await usdaSearch("chicken breast");
    if(f){ const per=usdaMacrosPer100(f); toast("Connected ✓",(f.description||"chicken")+" · "+Math.round(per.kcal)+" kcal/100g"); }
    else toast("Connected — no result");
  }catch(e){ toast("Connection failed",String(e.message||e)+". Check the key."); }
}

/* ---- ingredient parsing ---- */
const UNIT_ALIAS={g:"g",gram:"g",grams:"g",gr:"g",kg:"kg",kilogram:"kg",kilograms:"kg",mg:"mg",
  oz:"oz",ounce:"oz",ounces:"oz",lb:"lb",lbs:"lb",pound:"lb",pounds:"lb",
  cup:"cup",cups:"cup",tbsp:"tbsp",tablespoon:"tbsp",tablespoons:"tbsp",tbs:"tbsp",tb:"tbsp",
  tsp:"tsp",teaspoon:"tsp",teaspoons:"tsp",ml:"ml",milliliter:"ml",milliliters:"ml",l:"l",liter:"l",liters:"l",litre:"l",
  jar:"jar",jars:"jar",can:"can",cans:"can",box:"box",boxes:"box",pack:"pack",packs:"pack",package:"pack",packages:"pack",
  bag:"bag",bags:"bag",slice:"slice",slices:"slice",clove:"clove",cloves:"clove",stick:"stick",sticks:"stick",
  piece:"piece",pieces:"piece",pinch:"pinch",quart:"quart",qt:"quart",pint:"pint",pt:"pint",
  fillet:"piece",fillets:"piece",breast:"piece",breasts:"piece"};
const UNIT_GRAMS={g:1,kg:1000,mg:0.001,oz:28.35,lb:453.6,cup:240,tbsp:15,tsp:5,ml:1,l:1000,
  jar:680,can:400,box:454,pack:454,bag:454,slice:25,clove:3,stick:113,piece:120,pinch:0.5,quart:946,pint:473};
const UFRAC={"½":"1/2","¼":"1/4","¾":"3/4","⅓":"1/3","⅔":"2/3","⅛":"1/8","⅜":"3/8","⅝":"5/8","⅞":"7/8","⅕":"1/5","⅖":"2/5","⅗":"3/5","⅘":"4/5"};
function frac(s){ const m=String(s).split("/"); return m.length===2?(+m[0]||0)/(+m[1]||1):(+s||0); }
function evalQty(s){ s=String(s).trim();
  if(/\s/.test(s)){ const parts=s.split(/\s+/); return (+parts[0]||0)+frac(parts[1]); }
  if(s.indexOf("/")>0) return frac(s);
  return +s||0; }
function toGrams(qty,unit){ return Math.round(qty*((unit&&UNIT_GRAMS[unit]!=null)?UNIT_GRAMS[unit]:100)); }
function parseIngredientLine(raw){
  if(raw==null) return null;
  let s=String(raw).trim().replace(/^[\-\*•▪●]\s*/,"");
  if(!s) return null;
  s=s.replace(/(\d)\s*([½¼¾⅓⅔⅛⅜⅝⅞⅕⅖⅗⅘])/g,"$1 $2").replace(/[½¼¾⅓⅔⅛⅜⅝⅞⅕⅖⅗⅘]/g,ch=>UFRAC[ch]||"").replace(/\s+/g," ").trim();
  const m=s.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?)\s*(.*)$/);
  let qty=1, rest=s;
  if(m){ qty=evalQty(m[1]); rest=m[2]; }
  let unit="", name=rest;
  const um=rest.match(/^([A-Za-z]+)\.?(?:\s+(.*))?$/);
  if(um && UNIT_ALIAS[um[1].toLowerCase()]){ unit=UNIT_ALIAS[um[1].toLowerCase()]; name=um[2]||""; }
  name=name.replace(/^of\s+/i,"").replace(/\([^)]*\)/g,"").replace(/,.*$/,"").trim();
  if(!name) name=rest.trim();
  return {raw:String(raw).trim(), name, grams:toGrams(qty,unit), kcal:0, p:0, f:0, c:0};
}

/* ---- URL import (best effort — most sites block cross-origin reads) ---- */
async function fetchRecipeFromUrl(url){
  const res=await fetch(url);
  const html=await res.text();
  const doc=new DOMParser().parseFromString(html,"text/html");
  let recipe=null;
  doc.querySelectorAll('script[type="application/ld+json"]').forEach(sc=>{
    if(recipe) return;
    try{
      const data=JSON.parse(sc.textContent);
      const nodes=[];
      const push=o=>{ if(o&&typeof o==="object") nodes.push(o); };
      if(Array.isArray(data)) data.forEach(push); else { push(data); if(data&&Array.isArray(data["@graph"])) data["@graph"].forEach(push); }
      nodes.forEach(o=>{ if(recipe) return; const t=o["@type"];
        if(t==="Recipe"||(Array.isArray(t)&&t.indexOf("Recipe")>=0)) recipe=o; });
    }catch(e){}
  });
  if(!recipe) return null;
  const ing=(recipe.recipeIngredient||recipe.ingredients||[]).map(x=>String(x));
  let y=recipe.recipeYield; if(Array.isArray(y)) y=y[0];
  const ym=String(y||"").match(/\d+/);
  return {name:typeof recipe.name==="string"?recipe.name:"", yield:ym?+ym[0]:null, ingredients:ing};
}
async function importFromUrl(){
  const url=(gv("rcu")||"").trim();
  if(!url){ toast("Paste a URL first"); return; }
  toast("Fetching…","Reading the recipe page.");
  try{
    const rec=await fetchRecipeFromUrl(url);
    if(!rec){ toast("No recipe found","No structured recipe on that page. Paste the ingredients instead."); return; }
    if(rec.name) setv("rcn",rec.name);
    if(rec.yield) setv("rcs",rec.yield);
    if(rec.ingredients.length) setv("rci",rec.ingredients.join("\n"));
    toast("Imported ✓","Check the ingredients, then Create.");
  }catch(e){ toast("Couldn't load that URL","The site blocked the request. Copy the ingredient list and paste it instead."); }
}

/* ---- USDA lookups for ingredients ---- */
async function lookupAll(id){
  if(!S.profile.usdaKey){ toast("Add a USDA key first","Settings → Recipe Lookups."); return; }
  const r=getRecipe(id); if(!r) return;
  toast("Looking up…",r.ingredients.length+" ingredients");
  let done=0, fail=0;
  for(let i=0;i<r.ingredients.length;i++){
    const ing=r.ingredients[i];
    if(!ing.name || ing.kcal>0) continue;
    try{
      const food=await usdaSearch(ing.name);
      if(food){ const per=usdaMacrosPer100(food), g=ing.grams||0;
        ing.kcal=Math.round(per.kcal*g/100); ing.p=+(per.p*g/100).toFixed(1);
        ing.c=+(per.c*g/100).toFixed(1); ing.f=+(per.f*g/100).toFixed(1);
        ing.matched=food.description||""; done++; }
      else fail++;
    }catch(e){ fail++; if(String(e.message||e).indexOf("key")>=0){ toast("Lookup stopped",String(e.message||e)); break; } }
    save(); repaint();
  }
  toast("Lookup done",done+" matched"+(fail?", "+fail+" need a manual number":""));
}
async function lookupFromSheet(id,i){
  const name=(gv("ein")||"").trim(), g=+gv("eig")||0;

  toast("Looking up…",name);
  try{

    const per=usdaMacrosPer100(food);
    setv("eik",Math.round(per.kcal*g/100)); setv("eip",+(per.p*g/100).toFixed(1));
    setv("eic",+(per.c*g/100).toFixed(1)); setv("eif",+(per.f*g/100).toFixed(1));
    toast("Filled from USDA",food.description||name);
  }catch(e){ toast("Lookup failed",String(e.message||e)); }
}

        <div class="big">${Math.round(t.kcal)}</div>
        <div class="muted" style="margin-top:4px">kcal total</div>
        <div class="tiny" style="margin-top:8px">P ${Math.round(t.p)}g · C ${Math.round(t.c)}g · F ${Math.round(t.f)}g</div></div>
    </div>
    <div class="card"><div class="ctitle">Servings this recipe makes</div>
      <div class="row" style="justify-content:center;gap:22px">
        <button class="btn g sm" style="width:56px" onclick="bumpServings('${id}',-1)">−</button>
        <div style="font-size:26px;font-weight:800;min-width:34px;text-align:center">${r.servings}</div>
        <button class="btn b sm" style="width:56px" onclick="bumpServings('${id}',1)">＋</button></div>
    </div>
    <div class="card"><div class="ctitle">Ingredients${key&&missing?` <button class="tiny" style="color:var(--str);font-weight:700" onclick="lookupAll('${id}')">Look up all ${missing}</button>`:""}</div>
      ${r.ingredients.length?r.ingredients.map((ing,i)=>`<div class="lrow">
        <div style="flex:1;min-width:0;cursor:pointer" onclick="editIngredientSheet('${id}',${i})">
          <b style="font-size:14px">${esc(ing.raw||ing.name||"(unnamed)")}</b>
          <div class="tiny">${Math.round(ing.grams)||"?"} g · ${ing.kcal?Math.round(ing.kcal)+" kcal · "+Math.round(ing.p)+"g P":`<span style="color:var(--warn)">tap to set macros</span>`}${ing.matched?` · <span style="color:var(--dim2)">${esc(ing.matched)}</span>`:""}</div></div>
        <button class="tiny" style="color:#e5484d;font-weight:700;padding:0 4px" onclick="event.stopPropagation();delIngredient('${id}',${i})">✕</button></div>`).join("")
        :`<div class="empty">No ingredients yet.</div>`}
      <button class="btn ghost sm" style="margin-top:10px" onclick="addIngredientSheet('${id}')">+ Add ingredient</button>
    </div>
    ${!key?`<div class="card" style="border-color:#4a3a1a;background:#181509">
      <div class="muted" style="font-size:13px;line-height:1.6;color:#ffdc9e">Add a free USDA API key in Settings to auto-fill macros. Until then, tap each ingredient to type them in.</div></div>`:""}
    <button class="btn p" style="margin-bottom:10px" onclick="logRecipeSheet('${id}')">Log a portion I ate</button>
    <button class="btn ghost sm" style="color:#e5484d;border-color:#4a2226;margin-bottom:20px" onclick="delRecipe('${id}')">Delete recipe</button>`;
};

/* ---------------- BOOT ---------------- */
window.addEventListener("error",e=>console.warn("HYBRID error:",e.message));
(function boot(){
  if(!S.onboarded){ onbStep=0; onbData={trackFC:true}; paintOnb(); }
  else { paint(); }
  setTimeout(flushToasts,500);
})();
/* Register the service worker so the app installs, works offline, and updates
   itself. When a new version ships, the SW activates and the page reloads once —
   localStorage (all your progress) is untouched by this. Skipped on file://. */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  const hadController = !!navigator.serviceWorker.controller;   // false on first-ever install
  let refreshing=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(refreshing || !hadController) return;         // don't reload on the very first install
    // Never interrupt a live workout — hold the update until they leave it (see nav()).
    if(route && route.page==="workout" && S.active){
      window.__pendingSWReload=true;
      toast("Update ready","Refreshes when you finish this workout.");
      return;
    }
    refreshing=true; location.reload();
  });
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{ if(reg&&reg.update) setInterval(()=>reg.update(),60*60*1000); })
      .catch(e=>console.warn("SW failed",e));
  });
}
</script>
</body>
</html>
